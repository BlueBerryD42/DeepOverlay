<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap');

    :root {
      /* Default Dark Theme */
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --card-content-bg: #252525;
      --text-primary: #e0e0e0;
      --text-secondary: #aaaaaa;
      --border-color: #333333;
      --border-light: #444444;
      --accent-color: #2196f3;
      --danger-color: #ef5350;
      --danger-bg: rgba(239, 83, 80, 0.1);
      --success-color: #66bb6a;

      --input-bg: #2c2c2c;
      --btn-bg: #2c2c2c;
      --btn-hover: #383838;
    }

    [data-theme="light"] {
      --bg-color: #fdfdfd;
      --card-bg: #ffffff;
      --card-content-bg: #f9f9f9;
      --text-primary: #333333;
      --text-secondary: #666666;
      --border-color: #dddddd;
      --border-light: #eeeeee;
      --accent-color: #1976d2;
      --danger-color: #d93025;
      --danger-bg: #fce8e6;
      --success-color: #388e3c;

      --input-bg: #ffffff;
      --btn-bg: #ffffff;
      --btn-hover: #eeeeee;
    }

    body {
      background: var(--bg-color);
      color: var(--text-primary);
      font-family: 'Roboto Mono', 'JetBrains Mono', monospace;
      padding: 40px;
      max-width: 900px;
      margin: 0 auto;
      transition: background 0.3s, color 0.3s;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* Icons */
    .icon {
      width: 24px;
      height: 24px;
      fill: currentColor;
      display: block;
    }

    .icon-large {
      width: 32px;
      height: 32px;
      fill: var(--accent-color);
      margin-bottom: 8px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    /* Theme Toggle */
    .theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .theme-toggle:hover {
      color: var(--text-primary);
      background: none;
    }

    /* Inputs */
    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-family: inherit;
      font-size: 16px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-primary);
      border-radius: 6px;
      margin-bottom: 20px;
      box-sizing: border-box;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--text-secondary);
    }

    /* Dashboard List */
    #dashboard-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Domain Group */
    .domain-group {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }

    .domain-header {
      padding: 15px 20px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-light);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }

    .domain-header:hover {
      background: var(--card-content-bg);
    }

    .domain-header .domain-name {
      font-weight: bold;
      font-size: 15px;
    }

    .domain-header .domain-meta {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .domain-header .toggle-icon {
      margin-right: 10px;
      font-size: 12px;
      transition: transform 0.2s;
      display: inline-block;
      color: var(--text-secondary);
    }

    .domain-header.open .toggle-icon {
      transform: rotate(90deg);
    }

    /* Page List (inside domain) */
    .page-list {
      display: none;
    }

    .page-list.open {
      display: block;
    }

    /* Page Row */
    .page-row {
      border-bottom: 1px solid var(--border-light);
    }

    .page-row:last-child {
      border-bottom: none;
    }

    .page-header {
      padding: 12px 20px 12px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      cursor: pointer;
    }

    .page-header:hover {
      background: var(--card-content-bg);
    }

    .page-path {
      color: var(--text-secondary);
      word-break: break-all;
      margin-right: 15px;
    }

    .page-path a {
      text-decoration: none;
      color: inherit;
    }

    .page-path a:hover {
      text-decoration: underline;
      color: var(--text-primary);
    }

    /* Notes Area */
    .notes-area {
      display: none;
      padding: 15px 20px 15px 40px;
      background: var(--card-content-bg);
      border-top: 1px dashed var(--border-light);
      border-bottom: 1px solid var(--border-light);
    }

    .notes-area.open {
      display: block;
    }

    textarea.note-editor {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      min-height: 60px;
      resize: vertical;
      box-sizing: border-box;
      background: var(--input-bg);
      color: var(--text-primary);
      margin-bottom: 10px;
    }

    textarea.note-editor:focus {
      border-color: var(--text-secondary);
      outline: none;
    }

    /* Buttons */
    button {
      padding: 6px 14px;
      cursor: pointer;
      background: var(--btn-bg);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-family: inherit;
      font-size: 12px;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--btn-hover);
    }

    button.danger {
      color: var(--danger-color);
      border-color: var(--danger-color);
      background: transparent;
    }

    button.danger:hover {
      background: var(--danger-bg);
    }

    .empty-state {
      text-align: center;
      color: var(--text-secondary);
      padding: 40px;
      font-style: italic;
    }

    /* Icons Grid Styles */
    .dashboard-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 8px 12px;
      margin-bottom: 10px;
    }

    .dashboard-title {
      margin: 0;
      font-size: 12px;
      font-weight: 600;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 4px;
      margin-bottom: 8px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dashboard-title .icon {
      width: 14px;
      height: 14px;
    }

    .usage-card {
      background: var(--card-content-bg);
      padding: 6px 10px;
      border-radius: 3px;
      border: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      gap: 8px;
      box-sizing: border-box;
      max-width: 100%;
    }

    .link-card {
      text-decoration: none;
      padding: 6px 8px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 3px;
      color: var(--text-primary);
      font-size: 10px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      gap: 4px;
      transition: transform 0.1s, border-color 0.2s;
      min-height: 32px;
      box-sizing: border-box;
    }

    .link-card:hover {
      border-color: var(--accent-color);
      transform: translateY(-1px);
    }

    .link-card .icon-large {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      margin: 0;
      display: block;
    }
  </style>
</head>

<body>
  <header>
    <h1>
      <!-- Logo Icon -->
      <svg class="icon" viewBox="0 0 24 24">
        <path
          d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM5 15h14v3H5zM5 6h14v3H5z" />
      </svg>
      DeepOverlay Manager
    </h1>
    <div class="header-actions">
      <!-- Theme Toggle -->
      <button id="theme-toggle" class="theme-toggle" title="Toggle Theme">
        <svg class="icon" viewBox="0 0 24 24">
          <path
            d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z" />
        </svg>
      </button>

      <span id="storage-usage"
        style="font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; margin-right: 15px;">...</span>
      <button id="refresh-btn">Refresh</button>
      <button id="export-btn">Export Data</button>
      <button id="clear-btn" class="danger">Clear Everything</button>
    </div>
  </header>

  <!-- Combined Settings Section -->
  <div class="dashboard-card">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: stretch;">
      
      <!-- Left: Appearance -->
      <div style="display: flex; flex-direction: column;">
        <h2 class="dashboard-title" style="margin-top: 0;">
          <svg class="icon" viewBox="0 0 24 24">
            <path
              d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-2.76-2.24-5-5-5zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" />
          </svg>
          Appearance
        </h2>
        <div style="display: flex; flex-direction: column; gap: 8px; flex: 1; justify-content: flex-start;">

          <!-- Opacity -->
          <div style="display: flex; align-items: center; gap: 6px;">
            <label style="width: 50px; color: var(--text-secondary); font-size: 11px;">Opacity</label>
            <input type="range" id="opt-opacity" min="0.1" max="1.0" step="0.1" style="flex: 1;">
            <span id="val-opacity"
              style="width: 22px; text-align: right; color: var(--text-primary); font-size: 11px;">1.0</span>
          </div>

          <!-- Border Color -->
          <div style="display: flex; align-items: center; gap: 6px;">
            <label style="width: 50px; color: var(--text-secondary); font-size: 11px;">Border</label>
            <input type="color" id="opt-border-color" value="#000000"
              style="height: 20px; width: 35px; cursor: pointer; border: none; padding: 0; border-radius: 2px;">
          </div>

          <!-- Background Color -->
          <div style="display: flex; align-items: center; gap: 6px;">
            <label style="width: 50px; color: var(--text-secondary); font-size: 11px;">Fill</label>
            <input type="color" id="opt-bg-color" value="#ffffff"
              style="height: 20px; width: 35px; cursor: pointer; border: none; padding: 0; border-radius: 2px;">
          </div>

        </div>
      </div>

      <!-- Right: Google Cloud Status -->
      <div style="display: flex; flex-direction: column;">
        <h2 class="dashboard-title" style="margin-top: 0;">
          <svg class="icon" viewBox="0 0 24 24">
            <path
              d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z" />
          </svg>
          Google Cloud Status
        </h2>

        <div style="display: flex; flex-direction: column; gap: 8px; flex: 1;">
          <!-- Usage Card -->
          <div class="usage-card" style="display: flex; width: 100%; max-width: 100%; box-sizing: border-box; justify-content: space-between;">
            <span style="font-size: 9px; color: var(--text-secondary); text-transform: uppercase;">Usage:</span>
            <span style="font-size: 14px; font-weight: bold; color: var(--text-primary);">
              <span id="usage-count">...</span><span style="font-size: 11px; color: var(--text-secondary);">/1000</span>
            </span>
          </div>

          <!-- Links Grid -->
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;">
            <a href="https://console.cloud.google.com/run" target="_blank" class="link-card">
              <svg class="icon-large" viewBox="0 0 24 24" style="margin: 0; display: block;">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
              </svg>
              <div style="font-size: 10px; font-weight: 600; white-space: nowrap;">Cloud Run</div>
            </a>

            <a href="https://console.cloud.google.com/billing" target="_blank" class="link-card">
              <svg class="icon-large" viewBox="0 0 24 24" style="margin: 0; display: block;">
                <path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z" />
              </svg>
              <div style="font-size: 10px; font-weight: 600; white-space: nowrap;">Billing</div>
            </a>

            <a href="https://console.cloud.google.com/iam-admin/quotas?pageState=(%22allQuotasTable%22:(%22f%22:%22%255B%257B_22k_22_3A_22_22_2C_22t_22_3A10_2C_22v_22_3A_22_5C_22Cloud%2520Vision%2520API_5C_22_22_2C_22s_22_3Atrue_2C_22i_22_3A_22service_22%257D%255D%22))" target="_blank" class="link-card">
              <svg class="icon-large" viewBox="0 0 24 24" style="margin: 0; display: block;">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
              </svg>
              <div style="font-size: 10px; font-weight: 600; white-space: nowrap;">Quotas</div>
            </a>

            <a href="https://console.cloud.google.com/artifacts" target="_blank" class="link-card">
              <svg class="icon-large" viewBox="0 0 24 24" style="margin: 0; display: block;">
                <path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z" />
              </svg>
              <div style="font-size: 10px; font-weight: 600; white-space: nowrap;">Artifacts</div>
            </a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <input type="text" id="search-input" placeholder="Search pages or note content...">

  <div id="dashboard-list">
    <!-- Items injected here by JS -->
    <div class="empty-state">Loading...</div>
  </div>

  <script src="options.js"></script>
</body>

</html>
